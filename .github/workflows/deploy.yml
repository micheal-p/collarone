name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REMOTE_HOST: 72.61.156.142
  REMOTE_USER: root

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace client
      - run: npm run typecheck --workspace client

  # The safety-net tests. The pricing golden's estimator layer always runs
  # (no secrets needed). When a DATABASE_URL secret exists (Supabase session
  # pooler string), the live layers run too: SQL-vs-estimator pricing matrix,
  # the cross-tenant RLS probe, and the payroll golden values — so the bug
  # classes we've fixed (cross-tenant leaks, display-vs-billing drift, tax
  # math) can never quietly return.
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pg driver (only needed for the live-DB layers)
        if: env.DATABASE_URL != ''
        run: npm install --no-save pg
      - name: Pricing golden (estimator layer; + live SQL matrix when DB secret set)
        run: node test/pricing_besttier_golden.mjs

      - name: Pinned tools stay free (never enter the suite-count price math)
        run: node test/pinned_tools_not_priced.mjs

      - name: FAQ structured data still matches the page
        run: node test/faq_jsonld_matches.mjs

      - name: Invoice amounts read correctly in words
        run: node test/amount_in_words.mjs

      - name: Trade documents say the right thing about money
        run: node test/invoice_document_rules.mjs

      - name: Every product-tour step points at a real element
        run: node test/tour_targets.mjs

      - name: The demo answers every route the app calls
        run: node test/demo_route_parity.mjs

      - name: Every audited action is one the audit-log constraint allows
        run: node test/audit_actions_in_sync.mjs

      - name: Cross-tenant RLS probe + payroll golden + support read-only (live DB)
        if: env.DATABASE_URL != ''
        run: |
          node test/rls_probe.mjs
          node test/payroll_golden.mjs
          DB_URL="$DATABASE_URL" node test/support_write_denial.mjs

  deploy:
    needs: [typecheck, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt/3"
            if ./deploy/deploy.sh; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "All 3 deploy attempts failed"
          exit 1
