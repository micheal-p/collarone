name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Auto-reroll attempt counter (leave as 1 for manual runs)'
        default: '1'
      override_freeze:
        description: 'Ship during payroll week (25th to month end). Only for fixes that cannot wait.'
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REMOTE_HOST: 72.61.156.142
  REMOTE_USER: root

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace client
      - run: npm run typecheck --workspace client

  # The safety-net tests. The pricing golden's estimator layer always runs
  # (no secrets needed). When a DATABASE_URL secret exists (Supabase session
  # pooler string), the live layers run too: SQL-vs-estimator pricing matrix,
  # the cross-tenant RLS probe, and the payroll golden values — so the bug
  # classes we've fixed (cross-tenant leaks, display-vs-billing drift, tax
  # math) can never quietly return.
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pg driver (only needed for the live-DB layers)
        if: env.DATABASE_URL != ''
        run: npm install --no-save pg
      - name: Pricing golden (estimator layer; + live SQL matrix when DB secret set)
        run: node test/pricing_besttier_golden.mjs

      - name: Pinned tools stay free (never enter the suite-count price math)
        run: node test/pinned_tools_not_priced.mjs

      - name: FAQ structured data still matches the page
        run: node test/faq_jsonld_matches.mjs

      - name: Invoice amounts read correctly in words
        run: node test/amount_in_words.mjs

      - name: Trade documents say the right thing about money
        run: node test/invoice_document_rules.mjs

      - name: Downloaded trade-document HTML matches the template
        run: node test/invoice_html_renders.mjs

      - name: Every product-tour step points at a real element
        run: node test/tour_targets.mjs

      - name: The demo answers every route the app calls
        run: node test/demo_route_parity.mjs

      - name: Every audited action is one the audit-log constraint allows
        run: node test/audit_actions_in_sync.mjs

      - name: Private storage buckets are org-prefixed (static half)
        run: node test/storage_tenant_scoped.mjs

      - name: Storefront headings can't inject markup (XSS)
        run: node test/storefront_no_xss.mjs

      - name: Turnstile is graceful when off, enforced when on
        run: node test/turnstile_graceful.mjs

      - name: User-supplied URLs are sanitised before becoming links
        run: node test/safe_url.mjs

      - name: Suite tile colours stay distinct and readable
        run: node test/suite_palette.mjs

      - name: Confirm-by-typing gates accept what they told you to type
        run: node test/destructive_confirm.mjs

      - name: Bank disbursement files are byte-for-byte what we pinned
        run: node test/bank_export_formats.mjs

      - name: Money is right-aligned, focus is visible, empty states explain themselves
        run: node test/ui_quality.mjs

      - name: Nobody is credited on a commit who did not write it
        # Needs the full history, not the default shallow clone of one commit.
        run: |
          git fetch --unshallow --quiet 2>/dev/null || true
          node test/commit_authorship.mjs

      - name: Cross-tenant RLS probe + payroll golden + support read-only (live DB)
        if: env.DATABASE_URL != ''
        run: |
          node test/rls_probe.mjs
          node test/payroll_golden.mjs
          DB_URL="$DATABASE_URL" node test/support_write_denial.mjs
          DB_URL="$DATABASE_URL" node test/storage_tenant_scoped.mjs
          DB_URL="$DATABASE_URL" node test/definer_org_scope.mjs
          DB_URL="$DATABASE_URL" node test/migrations_rerunnable.mjs
          DB_URL="$DATABASE_URL" node test/anon_execute.mjs

  # ---- payroll week ---------------------------------------------------------
  # Nigerian salaries are paid at the end of the month, and the days around
  # that are when payroll is generated, approved and handed to the bank. A
  # deploy that breaks something on the 27th does not cost a page view, it
  # costs somebody their salary arriving on time — and it lands on the days
  # when the people who could fix it are busiest.
  #
  # Not a hard block: an override exists, because a security fix during payroll
  # week must still ship. It is a speed bump that makes shipping during that
  # window a decision somebody made on purpose.
  payroll-freeze:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - id: check
        env:
          OVERRIDE: ${{ github.event.inputs.override_freeze || 'false' }}
        run: |
          # Lagos, not UTC. On the 25th at 23:30 WAT it is still the 25th here
          # and already the 25th in UTC, but at 00:30 WAT on the 26th UTC still
          # reads the 25th — the window has to follow the working day of the
          # people running payroll.
          DAY=$(TZ=Africa/Lagos date +%-d)
          LAST=$(TZ=Africa/Lagos date -d "$(TZ=Africa/Lagos date +%Y-%m-01) +1 month -1 day" +%-d)
          echo "Lagos day-of-month: $DAY (month has $LAST days)"
          if [ "$OVERRIDE" = "true" ]; then
            echo "Override set — shipping during payroll week deliberately."
            echo "frozen=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # From the 25th to the end of the month.
          if [ "$DAY" -ge 25 ]; then
            echo "::warning::Payroll week (day $DAY). Deploy is frozen."
            # A skipped job does not fail the workflow, so without this a push
            # during payroll week would show a green tick and quietly not ship.
            # The summary is the first thing shown on the run page.
            {
              echo "## Not deployed — payroll week"
              echo
              echo "It is the **${DAY}th** in Lagos. Deploys are frozen from the 25th to the end of the month,"
              echo "because that is when payroll is generated, approved and handed to the bank."
              echo
              echo "**This commit is on main but is NOT running in production.**"
              echo
              echo "To ship it anyway: Actions → Deploy to VPS → Run workflow → set \`override_freeze\` to \`true\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [typecheck, tests, payroll-freeze]
    if: ${{ needs.payroll-freeze.outputs.frozen != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Single attempt on purpose: when the VPS refuses THIS runner's IP, retrying
      # from the same runner (same IP) can't succeed and only risks deepening the
      # fail2ban timer. Fail fast; the reroll job below re-dispatches on a FRESH
      # runner (fresh IP), which is what actually gets through.
      - name: Deploy
        env:
          # Seeds BACKUP_DB_URL onto the box for the nightly dump. Reuses the
          # secret CI already holds rather than minting a second credential,
          # and the box already carries SUPABASE_SERVICE_KEY, which grants at
          # least as much. Empty when the secret is absent, and the deploy
          # simply skips the seeding.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./deploy/deploy.sh

  # A failed deploy tells the platform about itself — the row lands in
  # client_errors (path /deploy), shows in the app-errors inbox, and the
  # watchdog counts recent ones. Yesterday an afternoon of failed deploys was
  # invisible while the status page read 100%; never again silently.
  report-failure:
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tell the platform its deploy failed
        run: |
          curl -s -m 10 -X POST https://collarone.app/api/track \
            -H 'Content-Type: application/json' \
            -d "{\"message\":\"deploy pipeline failed: run ${{ github.run_id }} attempt ${{ github.event.inputs.attempt || '1' }}\",\"path\":\"/deploy\"}" || true

  # Auto-reroll. The deploy fails when the VPS refuses THIS run's runner IP
  # (intermittent fail2ban / firewall on port 22). A *new* run gets a *new*
  # runner IP, so on failure we re-dispatch ourselves with attempt+1 until it
  # lands or we hit the cap. GITHUB_TOKEN is permitted to trigger
  # workflow_dispatch — the single exception to Actions' recursion prevention —
  # so this needs no personal token. Expect a short chain of red runs ending in
  # a green one, with zero manual clicks.
  reroll:
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'failure' && fromJSON(github.event.inputs.attempt || '1') < 6 }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-dispatch on a fresh runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh has no checkout here to infer the repo from — without an
          # explicit repo it dies with "not a git repository", which is
          # exactly how the first real reroll failed. GH_REPO scopes every
          # gh call without needing a checkout step.
          GH_REPO: ${{ github.repository }}
          THIS_ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          next=$(( THIS_ATTEMPT + 1 ))
          echo "Deploy attempt $THIS_ATTEMPT failed (likely a runner-IP ban)."
          echo "Re-rolling as attempt $next/6 on a fresh runner."
          sleep 45   # brief cooldown before the next run picks up a new IP
          gh workflow run "Deploy to VPS" --ref main -f attempt="$next"
