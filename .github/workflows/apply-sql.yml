name: Run SQL on production

# A button for applying a migration file to the production database.
#
# Every migration here used to be pasted into the Supabase SQL editor by hand,
# from whoever's laptop had the dashboard open, with no record of what ran or
# whether it worked. This runs one file through deploy/apply-sql.mjs (one
# connection, one transaction: all of it lands or none of it does), using the
# DATABASE_URL secret the deploy's live tests already use, so the connection
# string never leaves GitHub. Then it runs the live database checks, so the
# log says not only "applied" but "and everything still holds".
#
# Actions → Run SQL on production → Run workflow → pick the file.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'File to apply, under supabase/ (e.g. supabase/bundles/pending_2026_10.sql)'
        required: true
        default: 'supabase/bundles/pending_2026_10.sql'

# Never two at once. Deliberately NOT the deploy's group: GitHub keeps only
# one pending run per group and cancels the older one, so sharing it could
# silently drop a queued deploy. Run this when no deploy is in flight.
concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FILE: ${{ github.event.inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only a .sql file inside supabase/, and one that exists. The input is
      # typed by a person, so it is checked rather than trusted.
      - name: Check the file
        run: |
          case "$FILE" in
            supabase/*.sql) ;;
            *) echo "::error::Only .sql files under supabase/ can be applied (got: $FILE)"; exit 1 ;;
          esac
          case "$FILE" in *..*) echo "::error::No '..' in the path"; exit 1 ;; esac
          [ -f "$FILE" ] || { echo "::error::$FILE does not exist on ${{ github.ref_name }}"; exit 1; }
          [ -n "$DATABASE_URL" ] || { echo "::error::The DATABASE_URL secret is not set"; exit 1; }
          echo "Will apply $FILE ($(wc -l < "$FILE") lines) from ${{ github.ref_name }} @ ${GITHUB_SHA::7}"

      # Only the root package (pg), not the client workspace.
      - name: Install the database driver
        run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Apply
        run: node deploy/apply-sql.mjs "$FILE"

      - name: Live database checks
        run: |
          node test/trade_doc_edit.mjs
          node test/notify_more.mjs
          node test/purchase_orders.mjs
          DB_URL="$DATABASE_URL" node test/anon_execute.mjs
          DB_URL="$DATABASE_URL" node test/definer_org_scope.mjs
          DB_URL="$DATABASE_URL" node test/migrations_rerunnable.mjs
